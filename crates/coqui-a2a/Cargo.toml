[package]
name = "coqui-a2a"
description = "A2A over a proven coqui-agentic-peer link, as a custom protocol binding, with a loopback HTTP command for unmodified A2A software"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["a2a", "agent", "peer", "protocol-binding"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[features]
# The HTTP JSON-RPC endpoint on a loopback address, for A2A software that knows nothing of links.
loopback = ["dep:axum", "dep:tokio", "dep:futures-util", "dep:tokio-stream"]
# The `coqui-a2a` command.
cli = ["loopback", "dep:clap", "dep:coqui-peer-webcrypto", "dep:coqui-peer-tls", "dep:rustls", "dep:url", "coqui-web/websocket"]

[[bin]]
name = "coqui-a2a"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "33be56624cd44f0948468ab2e0c1fb53b5ea5de1" }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "6fd0ca3446e7702d2dd323824a6b97b31851d665" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamps in the form the specification fixes: ISO 8601 in UTC.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", optional = true }
# The TLS configuration for a wss:// link; the in-band proof, not TLS, decides who the peer is.
coqui-peer-tls = { version = "=0.0.0-alpha.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", features = ["pin"] }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "6fd0ca3446e7702d2dd323824a6b97b31851d665", features = ["websocket"] }
proptest = "1"
url = "2.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
