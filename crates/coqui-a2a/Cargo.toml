[package]
name = "coqui-a2a"
description = "A2A over a proven coqui-agentic-peer link, as a custom protocol binding, with a loopback HTTP command for unmodified A2A software"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["a2a", "agent", "peer", "protocol-binding"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[features]
# The HTTP JSON-RPC endpoint on a loopback address, for A2A software that knows nothing of links.
loopback = ["dep:axum", "dep:tokio", "dep:futures-util", "dep:hyper", "dep:hyper-util", "dep:subtle", "serde_json/raw_value"]
# The `coqui-a2a` command.
cli = ["loopback", "dep:clap", "dep:coqui-peer", "dep:coqui-peer-webcrypto", "dep:coqui-peer-tls", "dep:rustls", "dep:url", "coqui-web/websocket"]

[[bin]]
name = "coqui-a2a"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "9b1fee4aa12969d7e070182ebc820ca7593fdc17" }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "445007acb04f1b11f8f0f7c9fcf104f694189a2b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamps in the form the specification fixes: ISO 8601 in UTC.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "json"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# The server underneath axum, for what axum::serve does not expose: a timeout and a cap per connection.
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"], optional = true }
# The bearer token's comparison.
subtle = { version = "2.6", default-features = false, optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", optional = true }
# Writing the token file so that two starts at once agree on one token.
coqui-peer = { version = "=0.0.0-alpha.1", optional = true }
# The TLS configuration for a wss:// link; the in-band proof, not TLS, decides who the peer is.
coqui-peer-tls = { version = "=0.0.0-alpha.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "59ecf70c28181a41c856ade747cfc4725684228a" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", features = ["pin"] }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "445007acb04f1b11f8f0f7c9fcf104f694189a2b", features = ["websocket"] }
proptest = "1"
url = "2.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
